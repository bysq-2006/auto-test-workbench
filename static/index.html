<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多智能体测试工作台</title>
  <link rel="stylesheet" href="/static/style.css?v=48">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.2" stroke-dasharray="44 8" transform="rotate(-52 12 12)"/>
          <circle cx="12" cy="12" r="2.4" class="brand-dot"/>
        </svg>
        <span class="brand-name">工作台</span>
      </div>
      <div class="round-picker" id="round-picker">
        <button type="button" class="round-switch" id="round-switch" aria-haspopup="listbox" aria-expanded="false">
          <span class="round-dot" id="round-dot"></span>
          <span class="round-text">
            <span class="round-name" id="round-name">未选择轮次</span>
            <span class="round-meta" id="round-meta">还没有轮次</span>
          </span>
          <svg class="round-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="round-menu" id="round-menu" hidden>
          <input class="round-search" id="round-search" type="search" autocomplete="off" placeholder="搜索轮次名或编号">
          <div class="round-list" id="round-list" role="listbox" aria-label="轮次"></div>
          <div class="round-actions" id="round-actions">
            <button type="button" class="round-action" id="round-new">新建轮次</button>
          </div>
          <form class="round-form" id="round-form" hidden autocomplete="off">
            <span class="round-form-title" id="round-form-title">新建轮次</span>
            <input class="round-input" id="round-form-name" type="text" maxlength="40" placeholder="名字，如 崇州-26.11.18">
            <input class="round-input" id="round-form-note" type="text" maxlength="200" placeholder="备注（可选）">
            <p class="round-form-tip" id="round-form-tip" hidden></p>
            <div class="round-form-actions">
              <button type="submit" class="round-submit" id="round-form-ok">创建</button>
              <button type="button" class="round-cancel" id="round-form-cancel">取消</button>
            </div>
          </form>
          <div class="round-ops" id="round-ops" hidden role="menu"></div>
        </div>
      </div>
      <nav id="nav">
        <a href="#/dashboard" data-page="dashboard">
          <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
          仪表盘
        </a>
        <a href="#/skills" data-page="skills">
          <svg viewBox="0 0 24 24"><path d="M8 4h8l1 4H7l1-4zm-1 4 3 12h4l3-12"/></svg>
          技能
        </a>
        <a href="#/tasks" data-page="tasks">
          <svg viewBox="0 0 24 24"><path d="M8 4h8v3H8zM6 8h12v12H6zM9 12h6M9 16h4"/></svg>
          任务
        </a>
        <a href="#/results" data-page="results">
          <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h4"/></svg>
          结果
        </a>
        <a href="#/browsers" data-page="browsers">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v12H4z"/><path d="M8 19h8"/><path d="M7 8h10v6H7z"/></svg>
          资源
        </a>
        <a href="#/messages" data-page="messages">
          <svg viewBox="0 0 24 24"><path d="M4 6h16v10H7l-3 3z"/></svg>
          消息
        </a>
        <a href="#/docs" data-page="docs">
          <svg viewBox="0 0 24 24"><path d="M5 4h8.5L19 9.5V20H5z"/><path d="M13.5 4v5.5H19"/><path d="M8 13h8M8 17h6"/></svg>
          使用说明
        </a>
      </nav>
    </aside>
    <div class="content">
      <header class="topbar">
        <span class="crumb">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
          <span id="crumb">仪表盘</span>
        </span>
        <span class="muted" id="clock"></span>
      </header>
      <div id="page"></div>
    </div>
  </div>

  <script type="module" src="/static/js/main.js?v=48"></script>
</body>
</html>
